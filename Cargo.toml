[workspace]
resolver = "2"
members = [
    "crates/induction-protocol",
    "crates/induction-host",
    "crates/induction-guest",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

# Dependency whitelist (ADR-0001 §"boundary"): the protocol and guest halves
# are pure serde-family; the host half adds tokio (process/io) + libc (prctl).
# Not allowed here, ever: okm/fjall, aura-*, effector-config, steel-core,
# pyo3, sandbox-runtime-rs, ureq, tokio-tungstenite — transports (WS) and
# sandbox policy belong to the HOST, not to the protocol.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
anyhow = "1"
tokio = { version = "1", features = [
    "rt", "rt-multi-thread", "macros", "io-util", "io-std", "process", "sync", "time",
] }
libc = "0.2"

[workspace.lints.rust]
# deny (not forbid): the PDEATHSIG pre_exec site needs one narrow, commented
# #[allow(unsafe_code)]; an unconditional allow must not hide there.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The standing rule: a fallible step returns `Result`, an absent value returns
# `Option`, and neither is short-circuited by a panic. deny (not forbid) so a
# genuinely unreachable state can carry one narrow, commented allow.
#
# `panic` catches `panic!` ONLY: `todo!`/`unimplemented!`/`unreachable!` are
# three separate lints, and NO clippy lint sees `assert!` at all. The three
# declaration-time asserts in `induction-guest`'s builders are therefore a
# review rule, declared in README §"The panic surface" rather than gated here.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"